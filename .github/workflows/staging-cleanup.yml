# Retire le staging d'une PR fermée (fusionnée ou non). pull_request_target : lu sur main,
# n'extrait jamais le code de la PR.
name: staging-cleanup
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: pages-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/publish.sh --remove "pr-${PR_NUMBER}"
